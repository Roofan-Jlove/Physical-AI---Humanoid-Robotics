name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - 0001-book-structure
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for better git operations

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'docs/package-lock.json'

      - name: Install Dependencies
        working-directory: ./docs
        run: npm install

      - name: Build Docusaurus
        working-directory: ./docs
        run: npm run build

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build
          cname: physical-ai-robotics.example.com  # Update with your custom domain if applicable

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: docusaurus-build
          path: docs/build
          retention-days: 30

  lint-markdown:
    name: Lint Markdown Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint Markdown Files
        continue-on-error: true
        run: markdownlint 'docs/docs/**/*.md' --fix

      - name: Check for Markdown Changes
        run: git diff --exit-code docs/docs/*.md || echo "Markdown files need formatting"

  validate-links:
    name: Validate Internal Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
          cache-dependency-path: 'docs/package-lock.json'

      - name: Install Dependencies
        working-directory: ./docs
        run: npm install

      - name: Build and Validate Links
        working-directory: ./docs
        run: npm run build 2>&1 | tee build.log

      - name: Report Build Status
        if: always()
        run: |
          if grep -q "ERROR" build.log; then
            echo "Build completed with errors"
            cat build.log
            exit 1
          else
            echo "Build completed successfully"
          fi
        working-directory: ./docs
